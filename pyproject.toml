[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "tone-and-gist"
version = "1.0.0"
description = "Summarise text and analyse its sentiment, from the command line or a small web app."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
keywords = ["sentiment-analysis", "summarization", "nlp", "text-analysis"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = []  # the core uses only the Python standard library

[project.optional-dependencies]
pdf = ["pypdf>=4.0"]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
tone-and-gist = "tone_and_gist.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tone_and_gist = ["web/*", "samples/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]
